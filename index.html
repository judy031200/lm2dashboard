<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Broker Dashboard</title>
<style>
/* ── RESET & TOKENS ─────────────────────────────────────── */
:root{
  --bg:#0f1117;--s1:#1a1d27;--s2:#22263a;
  --bd:rgba(255,255,255,.08);
  --ac:#f97316;--bl:#3b82f6;--gr:#22c55e;--rd:#ef4444;
  --tx:#e2e8f0;--mt:#64748b;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",sans-serif;font-size:14px;min-height:100vh}
a{color:inherit;text-decoration:none}

/* ── LOADING ─────────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:999}
.spinner{width:36px;height:36px;border:3px solid var(--s2);border-top-color:var(--ac);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--mt);font-size:.85rem}

/* ── HEADER ──────────────────────────────────────────────── */
.hdr{background:var(--s1);border-bottom:1px solid var(--bd);padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:var(--ac);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.logo h1{font-size:1rem;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbadge{background:var(--s2);border:1px solid var(--bd);padding:4px 13px;
  border-radius:999px;font-size:.74rem;color:var(--mt)}
.pbadge b{color:var(--tx)}
.btn-refresh{background:none;border:1px solid var(--bd);color:var(--mt);
  padding:4px 13px;border-radius:8px;cursor:pointer;font-size:.74rem}
.btn-refresh:hover{color:var(--tx);border-color:var(--ac)}

/* ── ERROR BANNER ────────────────────────────────────────── */
.err-box{margin:20px 28px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
  border-radius:var(--r);padding:16px 20px;color:var(--rd);font-size:.85rem}

/* ── SUMMARY CARDS ───────────────────────────────────────── */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;padding:20px 28px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 18px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:2px}
.card.or::after{background:var(--ac)}.card.bl::after{background:var(--bl)}.card.gr::after{background:var(--gr)}
.card-lbl{font-size:.67rem;color:var(--mt);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.card-val{font-size:1.4rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.card-sub{font-size:.71rem;color:var(--mt);margin-top:4px}
.gbadge{display:inline-flex;align-items:center;gap:3px;font-size:.69rem;font-weight:600;
  padding:2px 7px;border-radius:999px;margin-top:5px}
.up{background:rgba(34,197,94,.12);color:var(--gr)}
.dn{background:rgba(239,68,68,.12);color:var(--rd)}
.nu{background:var(--s2);color:var(--mt)}

/* ── BAR CHART ───────────────────────────────────────────── */
.chart-sec{padding:0 28px 12px}
.sec-lbl{font-size:.67rem;color:var(--mt);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bar-name{width:150px;text-align:right;font-size:.74rem;color:var(--mt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;background:var(--s2);border-radius:4px;height:20px;overflow:hidden}
.bar-fill{height:100%;background:var(--bl);border-radius:4px;
  display:flex;align-items:center;padding-left:7px;min-width:36px;
  transition:width .65s cubic-bezier(.4,0,.2,1)}
.bar-fill.ac{background:var(--ac)}
.bar-val{font-size:.69rem;color:#fff;font-weight:600;white-space:nowrap}

/* ── TABLE ───────────────────────────────────────────────── */
.tbl-sec{padding:14px 28px 28px}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px}
.sec-title{font-size:.9rem;font-weight:700}
.search{background:var(--s1);border:1px solid var(--bd);border-radius:8px;
  padding:6px 11px;color:var(--tx);font-size:.79rem;outline:none;width:200px}
.search:focus{border-color:var(--ac)}.search::placeholder{color:var(--mt)}
.tbl-wrap{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{background:var(--s2);padding:9px 12px;text-align:left;
  font-size:.65rem;color:var(--mt);text-transform:uppercase;letter-spacing:.07em;
  font-weight:600;white-space:nowrap}
tbody tr{border-top:1px solid var(--bd);cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--s2)}
tbody td{padding:10px 12px;font-size:.79rem;vertical-align:middle}
.nr{text-align:right;font-variant-numeric:tabular-nums}
.new-badge{display:inline-flex;align-items:center;justify-content:center;
  background:rgba(249,115,22,.15);color:var(--ac);font-size:.67rem;font-weight:700;
  border-radius:999px;min-width:20px;height:18px;padding:0 6px}
.zero{color:var(--mt)}
.bfw{font-weight:600}

/* ── MODAL ───────────────────────────────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:200;align-items:flex-start;justify-content:center;
  padding:32px 14px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
  width:100%;max-width:840px}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid var(--bd)}
.modal-title{font-size:.9rem;font-weight:700}
.close-btn{background:none;border:1px solid var(--bd);color:var(--mt);
  width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:.9rem;
  display:flex;align-items:center;justify-content:center}
.close-btn:hover{color:var(--tx)}
.modal-body{padding:15px 20px}
.tabs{display:flex;gap:6px;margin-bottom:13px}
.tab{background:var(--s2);border:1px solid var(--bd);border-radius:7px;
  padding:4px 12px;font-size:.73rem;color:var(--mt);cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.pane{display:none;overflow-x:auto}.pane.on{display:block}
.mini{width:100%;border-collapse:collapse;font-size:.76rem;min-width:460px}
.mini th{background:var(--s2);padding:7px 9px;text-align:left;
  font-size:.63rem;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.mini td{padding:8px 9px;border-top:1px solid var(--bd)}
.empty{color:var(--mt);font-size:.78rem;padding:14px 0;text-align:center}

/* ── FOOTER ──────────────────────────────────────────────── */
.footer{text-align:center;padding:12px;font-size:.67rem;
  color:var(--mt);border-top:1px solid var(--bd)}

@media(max-width:600px){
  .hdr,.sum,.chart-sec,.tbl-sec{padding-left:13px;padding-right:13px}
  .sum{grid-template-columns:1fr 1fr}
  .bar-name{width:80px}
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p>Đang tải dữ liệu...</p>
</div>

<!-- APP (ẩn cho đến khi load xong) -->
<div id="app" style="display:none">

  <!-- HEADER -->
  <div class="hdr">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <h1>Broker Performance Dashboard</h1>
    </div>
    <div class="hdr-right">
      <div class="pbadge">So sánh: <b id="prevName">—</b> → <b id="currName">—</b></div>
      <button class="btn-refresh" onclick="loadData()">↻ Làm mới</button>
    </div>
  </div>

  <!-- ERROR -->
  <div class="err-box" id="errBox" style="display:none"></div>

  <!-- SUMMARY -->
  <div class="sum">
    <div class="card or">
      <div class="card-lbl">Tài khoản mới</div>
      <div class="card-val" id="sNew">—</div>
      <div class="card-sub" id="sTotal">Tổng TK: —</div>
    </div>
    <div class="card bl">
      <div class="card-lbl">Tổng NAV</div>
      <div class="card-val" id="sNAV">—</div>
      <div id="sNAVg"></div>
    </div>
    <div class="card bl">
      <div class="card-lbl">Tổng AUM</div>
      <div class="card-val" id="sAUM">—</div>
      <div id="sAUMg"></div>
    </div>
    <div class="card gr">
      <div class="card-lbl">Tổng Fee</div>
      <div class="card-val" id="sFee">—</div>
      <div id="sFeeG"></div>
    </div>
  </div>

  <!-- CHART -->
  <div class="chart-sec">
    <div class="sec-lbl">AUM theo broker — top 10</div>
    <div id="barChart"></div>
  </div>

  <!-- TABLE -->
  <div class="tbl-sec">
    <div class="tbl-hdr">
      <div class="sec-title">Chi tiết theo broker</div>
      <input class="search" id="searchBox" type="text" placeholder="Tìm broker...">
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Broker / AE</th>
            <th class="nr">TK mới</th>
            <th class="nr">Tổng TK</th>
            <th class="nr">NAV</th>
            <th class="nr">AUM</th>
            <th class="nr">Fee</th>
            <th class="nr">Tăng trưởng fee</th>
          </tr>
        </thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  </div>

  <div class="footer" id="footer">—</div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="modalTitle">Chi tiết</div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <div class="modal-body">
      <div class="tabs">
        <div class="tab on" id="tab1">TK mới <span id="cnt1"></span></div>
        <div class="tab"    id="tab2">KH hiện hữu <span id="cnt2"></span></div>
      </div>
      <div class="pane on" id="pane1"></div>
      <div class="pane"    id="pane2"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  ⚙️  CẤU HÌNH — chỉ sửa dòng này
//  Dán URL Apps Script Web App của bạn vào đây
// ============================================================
var API_URL = "https://script.google.com/macros/s/AKfycbx5X7ERRhXd_Hx_AlpGtmbh5CzQ9MpYbz34_q8g1x9TR3QWvdpLJIV4qp7y2IQ8Cws5Sg/exec";
// ============================================================

var BROKERS = [];

/* ── FORMAT ─────────────────────────────────────────────── */
function fmt(n) {
  if (!n || n === 0) return "0";
  var a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 1e12) return s + (a/1e12).toFixed(2) + " nghìn tỷ";
  if (a >= 1e9)  return s + (a/1e9).toFixed(2)  + " tỷ";
  if (a >= 1e6)  return s + (a/1e6).toFixed(1)  + " tr";
  return s + a.toLocaleString("vi-VN");
}
function gbadge(v) {
  if (v === null || v === undefined) return '<span class="gbadge nu">—</span>';
  var c = v > 0 ? "up" : v < 0 ? "dn" : "nu";
  var a = v > 0 ? "▲" : v < 0 ? "▼" : "=";
  return '<span class="gbadge ' + c + '">' + a + " " + Math.abs(v).toFixed(1) + "%</span>";
}
function gdiff(v) {
  if (v === null || v === undefined) return '<span style="color:var(--mt)">—</span>';
  var c = v > 0 ? "var(--gr)" : v < 0 ? "var(--rd)" : "var(--mt)";
  return '<span style="color:' + c + '">' + (v > 0 ? "+" : "") + fmt(v) + "</span>";
}

/* ── LOAD DATA ───────────────────────────────────────────── */
function loadData() {
  document.getElementById("loading").style.display = "flex";
  document.getElementById("app").style.display     = "none";
  document.getElementById("errBox").style.display  = "none";

  // Thêm timestamp để tránh cache
  var url = API_URL + (API_URL.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();

  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display     = "block";
      if (data.error) {
        showError(data.error); return;
      }
      render(data);
    })
    .catch(function(err) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display     = "block";
      showError("Không lấy được dữ liệu: " + err.message
        + "<br><br>Kiểm tra lại <b>API_URL</b> trong file index.html"
        + " và đảm bảo Apps Script đã Deploy với quyền <b>Anyone</b>.");
    });
}

function showError(msg) {
  var box = document.getElementById("errBox");
  box.innerHTML = "⚠️ " + msg;
  box.style.display = "block";
}

/* ── RENDER ──────────────────────────────────────────────── */
function render(data) {
  BROKERS = data.brokers;
  var s   = data.summary;

  // Header
  document.getElementById("currName").textContent = data.currentName;
  document.getElementById("prevName").textContent = data.prevName || "—";

  // Cards
  document.getElementById("sNew").textContent   = s.totalNew;
  document.getElementById("sTotal").textContent = "Tổng TK: " + s.totalAccounts;
  document.getElementById("sNAV").textContent   = fmt(s.companyNAV);
  document.getElementById("sAUM").textContent   = fmt(s.companyAUM);
  document.getElementById("sFee").textContent   = fmt(s.companyFee);
  document.getElementById("sNAVg").innerHTML    = gbadge(s.growthNAV);
  document.getElementById("sAUMg").innerHTML    = gbadge(s.growthAUM);
  document.getElementById("sFeeG").innerHTML    = gbadge(s.growthFee);

  // Footer
  document.getElementById("footer").textContent =
    "Dữ liệu: " + data.currentName + " so với " + (data.prevName||"—")
    + " · Thêm sheet DB mới là tự cập nhật";

  renderChart();
  renderTable(BROKERS);
}

function renderChart() {
  var top = BROKERS.slice(0, 10);
  var mx  = Math.max.apply(null, top.map(function(b){ return b.totalAUM; }));
  if (mx <= 0) mx = 1;
  document.getElementById("barChart").innerHTML = top.map(function(b, i) {
    var p  = (b.totalAUM / mx * 100).toFixed(1);
    var nm = b.broker.replace(/^(FA |LM2 |LM )/g,"").split(" ").slice(0,3).join(" ");
    return '<div class="bar-row">'
      + '<div class="bar-name" title="' + b.broker + '">' + nm + '</div>'
      + '<div class="bar-track">'
      + '<div class="bar-fill' + (i===0?' ac':'') + '" style="width:' + p + '%">'
      + '<span class="bar-val">' + fmt(b.totalAUM) + '</span>'
      + '</div></div></div>';
  }).join("");
}

function renderTable(list) {
  document.getElementById("tblBody").innerHTML = list.map(function(b) {
    var idx = BROKERS.indexOf(b);
    return '<tr onclick="openModal(' + idx + ')">'
      + '<td class="bfw">' + b.broker + '</td>'
      + '<td class="nr">'
      +   (b.newCount > 0 ? '<span class="new-badge">+' + b.newCount + '</span>'
                          : '<span class="zero">0</span>')
      + '</td>'
      + '<td class="nr">' + b.totalCount + '</td>'
      + '<td class="nr">' + fmt(b.totalNAV) + '</td>'
      + '<td class="nr">' + fmt(b.totalAUM) + '</td>'
      + '<td class="nr">' + fmt(b.totalFee) + '</td>'
      + '<td class="nr">' + gbadge(b.growthFee) + '</td>'
      + '</tr>';
  }).join("");
}

/* ── MODAL ───────────────────────────────────────────────── */
function customerTable(accounts, showDelta) {
  if (!accounts || !accounts.length)
    return '<div class="empty">Không có dữ liệu.</div>';
  return '<table class="mini"><thead><tr>'
    + '<th>Tên khách hàng</th><th>Account</th>'
    + '<th class="nr">NAV</th><th class="nr">AUM</th><th class="nr">Fee</th>'
    + (showDelta ? '<th class="nr">Δ Fee</th>' : '')
    + '</tr></thead><tbody>'
    + accounts.map(function(r) {
        var d = showDelta && r.prevFee !== undefined ? r.fee - r.prevFee : null;
        return '<tr>'
          + '<td>' + r.name + '</td>'
          + '<td style="color:var(--mt)">' + r.account + '</td>'
          + '<td class="nr">' + fmt(r.nav) + '</td>'
          + '<td class="nr">' + fmt(r.aum) + '</td>'
          + '<td class="nr">' + fmt(r.fee) + '</td>'
          + (showDelta ? '<td class="nr">' + gdiff(d) + '</td>' : '')
          + '</tr>';
      }).join("")
    + '</tbody></table>';
}

function openModal(idx) {
  var b = BROKERS[idx];
  document.getElementById("modalTitle").textContent = b.broker;
  document.getElementById("cnt1").textContent = "(" + b.newAccounts.length   + ")";
  document.getElementById("cnt2").textContent = "(" + b.existAccounts.length + ")";
  document.getElementById("pane1").innerHTML  = customerTable(b.newAccounts,   false);
  document.getElementById("pane2").innerHTML  = customerTable(b.existAccounts, true);
  // reset tabs
  document.getElementById("tab1").className  = "tab on";
  document.getElementById("tab2").className  = "tab";
  document.getElementById("pane1").className = "pane on";
  document.getElementById("pane2").className = "pane";
  document.getElementById("overlay").classList.add("open");
}

document.getElementById("closeBtn").onclick = function() {
  document.getElementById("overlay").classList.remove("open");
};
document.getElementById("overlay").onclick = function(e) {
  if (e.target === document.getElementById("overlay"))
    document.getElementById("overlay").classList.remove("open");
};
document.getElementById("tab1").onclick = function() {
  this.className="tab on"; document.getElementById("tab2").className="tab";
  document.getElementById("pane1").className="pane on"; document.getElementById("pane2").className="pane";
};
document.getElementById("tab2").onclick = function() {
  this.className="tab on"; document.getElementById("tab1").className="tab";
  document.getElementById("pane2").className="pane on"; document.getElementById("pane1").className="pane";
};

/* ── SEARCH ──────────────────────────────────────────────── */
document.getElementById("searchBox").oninput = function() {
  var q = this.value.toLowerCase();
  renderTable(BROKERS.filter(function(b) {
    return b.broker.toLowerCase().indexOf(q) >= 0;
  }));
};

/* ── START ───────────────────────────────────────────────── */
loadData();
</script>
</body>
</html>
