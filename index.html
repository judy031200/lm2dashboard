<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Broker Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --or:#f97316;--or2:#ea6c0a;--or-bg:#fff7f0;--or-light:#fff3e8;
  --bg:#f5f5f5;--panel:#fff;--bd:#e8e8e8;--bd2:#d0d0d0;
  --tx:#1a1a1a;--tx2:#555;--tx3:#999;
  --gr:#16a34a;--gr-bg:#f0fdf4;
  --rd:#dc2626;--rd-bg:#fef2f2;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --mono:'Inter Tight',monospace;--sans:'Inter',system-ui,sans-serif;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;min-height:100vh}

/* LOADING */
#loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:999}
.spinner{width:36px;height:36px;border:3px solid #ffe8d6;border-top-color:var(--or);
  border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--tx3);font-size:.85rem}

/* HEADER */
.hdr{background:var(--panel);border-bottom:2px solid var(--or);padding:14px 32px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hdr-left{display:flex;align-items:center;gap:14px}
.logo{width:36px;height:36px;background:var(--or);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hdr h1{font-size:1.05rem;font-weight:700}

/* CONTROLS */
.controls{background:var(--panel);border-bottom:1px solid var(--bd);
  padding:10px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ctrl-label{font-size:.72rem;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.divv{width:1px;height:20px;background:var(--bd);margin:0 4px}
.sheet-tabs{display:flex;gap:5px;align-items:center;flex-wrap:wrap}

/* Month tab — multi-select */
.stab{padding:5px 14px;font-size:.8rem;font-weight:500;color:var(--tx2);cursor:pointer;
  border:1.5px solid var(--bd);border-radius:20px;transition:all .12s;white-space:nowrap;background:#fff;user-select:none}
.stab:hover{border-color:var(--or);color:var(--or)}
.stab.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}

/* Mode hint */
.mode-hint{
  margin:6px 32px 0;
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:5px;
  font-size:.75rem;font-weight:500;background:var(--or-bg);color:var(--or2)
}

/* ERR */
.err{margin:14px 32px;background:var(--rd-bg);border-left:3px solid var(--rd);
  border-radius:var(--r);padding:12px 16px;color:var(--rd);font-size:.82rem;line-height:1.6}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:0;background:var(--bd);border:1px solid var(--bd);margin:16px 32px;border-radius:var(--r);overflow:hidden}
.kpi{background:var(--panel);padding:14px 20px;position:relative;border-right:1px solid var(--bd)}
.kpi:last-child{border-right:none}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.kpi.k-or::before{background:var(--or)}.kpi.k-bl::before{background:var(--blue)}.kpi.k-gr::before{background:var(--gr)}
.kpi-lbl{font-size:.67rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;font-weight:500}
.kpi-val{font-family:var(--mono);font-size:1.3rem;font-weight:600;color:var(--tx);letter-spacing:-.02em;line-height:1.1}
.kpi-sub{font-size:.7rem;color:var(--tx3);margin-top:3px}
.kbadge{display:inline-flex;align-items:center;gap:2px;font-size:.68rem;font-weight:600;padding:2px 6px;border-radius:4px;margin-top:4px}
.kbadge.up{background:var(--gr-bg);color:var(--gr)}.kbadge.dn{background:var(--rd-bg);color:var(--rd)}.kbadge.nu{background:#f3f3f3;color:var(--tx3)}

/* SECTION */
.section{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);margin:0 32px 16px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:13px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:8px}
.sec-title{font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-title span{font-size:.72rem;font-weight:400;color:var(--tx3)}
.sec-body{padding:14px 20px}

/* BAR */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-name{width:160px;text-align:right;font-size:.78rem;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;background:#f3f3f3;border-radius:3px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:8px;min-width:40px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.bar-fill.c0{background:var(--or)}.bar-fill.c1{background:#fb923c}.bar-fill.c2{background:#fdba74}.bar-fill.cx{background:#d1d5db}
.bar-val{font-family:var(--mono);font-size:.68rem;color:#fff;font-weight:600;white-space:nowrap}

/* TABLE */
.search{background:#f8f8f8;border:1.5px solid var(--bd);border-radius:20px;
  padding:5px 14px;color:var(--tx);font-size:.8rem;outline:none;width:200px}
.search:focus{border-color:var(--or)}.search::placeholder{color:var(--tx3)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
thead th{background:#fafafa;padding:10px 12px;text-align:left;font-size:.7rem;color:var(--tx2);
  font-weight:600;border-bottom:2px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}
thead th.nr{text-align:right}
thead th.sorted{color:var(--or)}
thead th:hover{color:var(--or)}
.sort-arrow{margin-left:3px;opacity:.45;font-size:.62rem}
.sorted .sort-arrow{opacity:1;color:var(--or)}
tbody tr{border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--or-bg)}
tbody tr.total-row{background:var(--or-light);border-top:2px solid var(--or);cursor:default}
tbody tr.total-row:hover{background:var(--or-light)}
tbody td{padding:10px 12px;font-size:.8rem;vertical-align:middle}
.nr{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.bfw{font-weight:600}
.rank-circle{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.r1{background:var(--or);color:#fff}.r2{background:#fb923c;color:#fff}.r3{background:#fdba74;color:#fff}.rx{background:#e5e7eb;color:var(--tx2)}
.acc-badge{display:inline-flex;align-items:center;padding:3px 10px;background:var(--or);color:#fff;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
.acc-badge.zero{background:#e5e7eb;color:var(--tx3)}
.acc-badge.new-acc{background:var(--gr);color:#fff}
.gbadge{display:inline-flex;align-items:center;gap:2px;font-size:.7rem;font-weight:600;padding:2px 6px;border-radius:4px}
.gbadge.up{background:var(--gr-bg);color:var(--gr)}.gbadge.dn{background:var(--rd-bg);color:var(--rd)}.gbadge.nu{background:#f3f3f3;color:var(--tx3)}
.dash-cell{color:#ccc}
.total-label{font-weight:700;color:var(--or);font-size:.82rem}

/* Delta columns */
.d-up{color:var(--gr);font-family:var(--mono);font-size:.77rem}
.d-dn{color:var(--rd);font-family:var(--mono);font-size:.77rem}
.d-nu{color:var(--tx3);font-family:var(--mono);font-size:.77rem}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:var(--r);width:100%;max-width:900px;border:1px solid var(--bd);overflow:hidden}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--or-bg);border-bottom:2px solid var(--or)}
.modal-title{font-size:.9rem;font-weight:700;color:var(--or2)}
.xbtn{background:#fff;border:1.5px solid var(--bd);color:var(--tx3);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.xbtn:hover{border-color:var(--or);color:var(--or)}
.modal-body{padding:16px 20px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{background:#f3f3f3;border:1.5px solid var(--bd);border-radius:20px;padding:5px 14px;font-size:.78rem;color:var(--tx2);cursor:pointer;font-weight:500}
.tab.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.pane{display:none;overflow-x:auto}.pane.on{display:block}
.mini{width:100%;border-collapse:collapse;font-size:.79rem;min-width:520px}
.mini th{background:#fafafa;padding:8px 10px;text-align:left;font-size:.67rem;color:var(--tx2);font-weight:600;border-bottom:1.5px solid var(--bd)}
.mini th.nr{text-align:right}
.mini td{padding:8px 10px;border-bottom:1px solid #f3f3f3}
.empty-msg{color:var(--tx3);font-size:.82rem;padding:16px 0;text-align:center}

/* CHARTS GRID */
.charts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 32px 16px}
.chart-card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px}
.chart-title{font-size:.82rem;font-weight:700;color:var(--tx);margin-bottom:2px;display:flex;align-items:center;gap:7px}
.chart-title::before{content:"";display:inline-block;width:3px;height:13px;border-radius:2px;flex-shrink:0}
.ct-fee::before{background:#f97316}
.ct-nav::before{background:#2563eb}
.ct-aum::before{background:#16a34a}
.chart-sub{font-size:.7rem;color:var(--tx3);margin-bottom:10px}

/* FOOTER */
.footer{text-align:center;padding:12px;font-size:.7rem;color:var(--tx3);background:var(--panel);
  border:1px solid var(--bd);border-top:none;margin:0 32px 28px;border-radius:0 0 var(--r) var(--r)}
.btn{background:#fff;border:1.5px solid var(--bd);color:var(--tx2);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:.78rem;font-family:var(--sans)}
.btn:hover{border-color:var(--or);color:var(--or)}

@media(max-width:1000px){.charts-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){
  .hdr,.controls,.kpi-strip,.section,.footer,.mode-hint,.err,.charts-grid{padding-left:14px;padding-right:14px;margin-left:0;margin-right:0;border-radius:0}
  .kpi-strip,.section,.footer,.charts-grid{margin-left:10px;margin-right:10px}
  .kpi-strip{grid-template-columns:1fr 1fr}.bar-name{width:90px}
  .charts-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Đang tải dữ liệu...</p></div>

<div id="app" style="display:none">
<div class="hdr">
  <div class="hdr-left">
    <div class="logo">📊</div>
    <h1>Broker Performance Dashboard</h1>
  </div>
  <button class="btn" onclick="loadData()">↻ Làm mới</button>
</div>

<div class="controls">
  <span class="ctrl-label">Tháng</span>
  <div class="sheet-tabs" id="sheetTabs"></div>
</div>

<div id="modeHint" class="mode-hint">—</div>
<div class="err" id="errBox" style="display:none"></div>

<div class="kpi-strip">
  <div class="kpi k-or"><div class="kpi-lbl">Tài khoản mới</div><div class="kpi-val" id="sNew">—</div><div class="kpi-sub" id="sTotal">—</div></div>
  <div class="kpi k-bl"><div class="kpi-lbl">Tổng NAV</div><div class="kpi-val" id="sNAV">—</div><div id="sNAVg"></div></div>
  <div class="kpi k-bl"><div class="kpi-lbl">Tổng AUM</div><div class="kpi-val" id="sAUM">—</div><div id="sAUMg"></div></div>
  <div class="kpi k-gr"><div class="kpi-lbl">Tổng Fee</div><div class="kpi-val" id="sFee">—</div><div id="sFeeG"></div></div>
</div>

<!-- BAR CHART TOP -->
<div class="section">
  <div class="sec-hdr"><div class="sec-title">AUM theo broker <span>top 10</span></div></div>
  <div class="sec-body" id="barChart"></div>
</div>

<!-- CHARTS GRID -->
<div class="charts-grid" id="chartsGrid">
  <div class="chart-card">
    <div class="chart-title ct-fee">Trading Fee</div>
    <div class="chart-sub" id="cFeeSubtitle">Top 10 broker</div>
    <div style="position:relative;height:260px"><canvas id="cFee"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title ct-nav">NAV</div>
    <div class="chart-sub" id="cNAVSubtitle">Top 10 broker</div>
    <div style="position:relative;height:260px"><canvas id="cNAV"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title ct-aum">AUM</div>
    <div class="chart-sub" id="cAUMSubtitle">Top 10 broker</div>
    <div style="position:relative;height:260px"><canvas id="cAUM"></canvas></div>
  </div>
</div>

<!-- TABLE -->
<div class="section">
  <div class="sec-hdr">
    <div class="sec-title">Bảng Chi Tiết <span>(Click tiêu đề để sắp xếp)</span></div>
    <input class="search" id="searchBox" type="text" placeholder="🔍 Tìm broker...">
  </div>
  <div class="tbl-wrap">
    <table><thead id="tblHead"></thead><tbody id="tblBody"></tbody></table>
  </div>
</div>
<div class="footer" id="footer">—</div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hdr"><div class="modal-title" id="modalTitle">Chi tiết</div><button class="xbtn" id="closeBtn">✕</button></div>
    <div class="modal-body">
      <div class="tabs">
        <div class="tab on" id="tab1">TK mới <span id="cnt1"></span></div>
        <div class="tab"    id="tab2">KH hiện hữu <span id="cnt2"></span></div>
      </div>
      <div class="pane on" id="pane1"></div>
      <div class="pane"    id="pane2"></div>
    </div>
  </div>
</div>

<script>
var API_URL="https://script.google.com/macros/s/AKfycbzu2bwTwy8x5OqFIFSIXlqjwpLDbz7d5EoVK-oRhzjdxb11wT1E4q7tcfzGq5UnV0IOmQ/exec";
// NOTE: keep the original API URL from the source file
var RAW={},LABELS={},SHEETS=[];
var SELECTED=[];   // array of selected sheet keys, ordered as in SHEETS
var BROKERS=[];
var SORT_COL="tAUM",SORT_DIR=-1;
var CI={};  // chart instances

// ── FORMAT HELPERS ───────────────────────────────────────────
function fmt(n){
  if(n===null||n===undefined||n===0)return null;
  var s=n<0?"-":"";
  return s+(Math.abs(n)/1e9).toFixed(2)+" tỷ";
}
function fmtShort(n){
  if(n===null||n===undefined||n===0)return null;
  var s=n<0?"-":"";
  return s+(Math.abs(n)/1e9).toFixed(2)+" tỷ";
}
function fd(n){var v=fmt(n);return v||'<span class="dash-cell">—</span>';}
function fdd(n){
  // for delta values: show + or - with color
  if(n===null||n===undefined)return'<span class="d-nu">—</span>';
  var c=n>0?"d-up":n<0?"d-dn":"d-nu";
  return'<span class="'+c+'">'+(n>0?"+":"")+fmt(n)+'</span>';
}
function kb(v){
  if(v===null||v===undefined)return'<span class="kbadge nu">—</span>';
  var c=v>0?"up":v<0?"dn":"nu",a=v>0?"▲":v<0?"▼":"=";
  return'<span class="kbadge '+c+'">'+a+" "+Math.abs(v).toFixed(1)+"%</span>";
}
function lbl(s){
  if(LABELS&&LABELS[s])return LABELS[s].replace("Thang","Tháng");
  return"Tháng "+parseInt(s.replace(/\D/g,""),10);
}

// ── LOAD ────────────────────────────────────────────────────
function loadData(){
  document.getElementById("loading").style.display="flex";
  document.getElementById("app").style.display="none";
  document.getElementById("errBox").style.display="none";
  fetch(API_URL+"?t="+Date.now())
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(d){
      document.getElementById("loading").style.display="none";
      document.getElementById("app").style.display="block";
      if(d.error){showErr(d.error);return;}
      RAW=d.raw;SHEETS=d.sheets;LABELS=d.labels||{};
      // Default: select last month only
      SELECTED=[SHEETS[SHEETS.length-1]];
      buildTabs();renderView();
    })
    .catch(function(e){
      document.getElementById("loading").style.display="none";
      document.getElementById("app").style.display="block";
      showErr("Không lấy được dữ liệu: "+e.message
        +"<br>→ Apps Script: <b>Deploy → Manage → Edit → Who has access: Anyone → New version → Deploy</b>");
    });
}
function showErr(m){var b=document.getElementById("errBox");b.innerHTML="⚠ "+m;b.style.display="block";}

// ── TABS (multi-select) ──────────────────────────────────────
function buildTabs(){
  var c=document.getElementById("sheetTabs");
  c.innerHTML="";
  SHEETS.forEach(function(s){
    var el=document.createElement("div");
    el.className="stab"+(SELECTED.indexOf(s)>=0?" on":"");
    el.textContent=lbl(s);el.title=s;
    el.onclick=(function(n){return function(){toggleSheet(n);};})(s);
    c.appendChild(el);
  });
}
function toggleSheet(s){
  var idx=SELECTED.indexOf(s);
  if(idx>=0){
    if(SELECTED.length===1)return; // must keep at least 1
    SELECTED.splice(idx,1);
  } else {
    SELECTED.push(s);
    // keep order matching SHEETS order
    SELECTED.sort(function(a,b){return SHEETS.indexOf(a)-SHEETS.indexOf(b);});
  }
  buildTabs();renderView();
}

// ── COMPUTE DATA ─────────────────────────────────────────────
/*
  Logic (mỗi tháng tự so với tháng liền trước):
  - Mỗi tháng được chọn: NAV_delta = NAV(tháng đó) − NAV(tháng trước)
                          AUM_delta = AUM(tháng đó) − AUM(tháng trước)
                          Fee / Trading = lấy giá trị tháng đó (tuyệt đối)
  - Nếu không có tháng trước (tháng đầu tiên trong data): lấy giá trị tuyệt đối
  - Nhiều tháng → cộng dồn delta của từng tháng
  - TK mới / TK hiện hữu lấy từ tháng được chọn (không tính tháng trước)
*/
function computeBrokers(){
  var n=SELECTED.length;
  if(n===0)return{brokers:[],summary:{totalNew:0,totalAccounts:0,cNAV:0,cAUM:0,cFee:0},hint:""};

  // For each selected sheet, compute delta vs previous sheet in SHEETS order
  var bm={};

  SELECTED.forEach(function(s){
    var sidx=SHEETS.indexOf(s);
    var curRows=RAW[s]||[];
    var prevRows=sidx>0?(RAW[SHEETS[sidx-1]]||[]):[];

    // Build prev map by account
    var pm={};
    prevRows.forEach(function(r){pm[r.account]=r;});

    curRows.forEach(function(row){
      var bk=row.broker||"Không rõ";
      if(!bm[bk])bm[bk]={broker:bk,newAcc:[],existAcc:[],
        tNAV:0,tAUM:0,tFee:0,tTrading:0,newCount:0};
      var b=bm[bk];

      // NAV & AUM = delta vs prev; Fee & Trading = absolute of this month
      var prev=pm[row.account];
      var prevNAV=prev?prev.nav:0;
      var prevAUM=prev?prev.aum:0;

      b.tNAV+=(row.nav-prevNAV);
      b.tAUM+=(row.aum-prevAUM);
      b.tFee+=row.fee;
      b.tTrading+=row.trading;

      if(row.isNew===true){
        b.newCount++;
        b.newAcc.push({name:row.name,account:row.account,nav:row.nav,aum:row.aum,fee:row.fee,trading:row.trading});
      } else {
        b.existAcc.push({name:row.name,account:row.account,nav:row.nav,aum:row.aum,fee:row.fee,trading:row.trading});
      }
      // track unique accounts for dedup
      if(!b._accounts)b._accounts={};
      b._accounts[row.account]=true;
    });
  });

  var cN=0,cA=0,cF=0,cT=0,nCnt=0,totAcc=0;
  var brokers=Object.keys(bm).map(function(k){
    var b=bm[k];
    var uniqueCount=Object.keys(b._accounts||{}).length;
    cN+=b.tNAV;cA+=b.tAUM;cF+=b.tFee;cT+=b.tTrading;
    nCnt+=b.newCount;
    totAcc+=uniqueCount;
    return{broker:b.broker,newAcc:b.newAcc,existAcc:b.existAcc,
      newCount:b.newCount,totalCount:uniqueCount,
      tNAV:b.tNAV,tAUM:b.tAUM,tFee:b.tFee,tTrading:b.tTrading};
  });

  // Build hint string
  var hintParts=SELECTED.map(function(s){
    var sidx=SHEETS.indexOf(s);
    var prevLabel=sidx>0?lbl(SHEETS[sidx-1]):"—";
    return lbl(s)+"−"+prevLabel;
  });
  var hint=n===1
    ? "NAV & AUM = "+hintParts[0]
    : "NAV & AUM = ("+hintParts.join(") + (")+")";

  return{brokers:brokers,
    summary:{totalNew:nCnt,totalAccounts:totAcc,cNAV:cN,cAUM:cA,cFee:cF},
    hint:hint};
}

// ── SORT ─────────────────────────────────────────────────────
function sortBrokers(list){
  return list.slice().sort(function(a,b){
    var va=a[SORT_COL]||0,vb=b[SORT_COL]||0;
    if(SORT_COL==="broker")return SORT_DIR*(a.broker.localeCompare(b.broker));
    return SORT_DIR*(vb-va);
  });
}
function setSort(col){
  if(SORT_COL===col)SORT_DIR*=-1;else{SORT_COL=col;SORT_DIR=-1;}
  renderTable(BROKERS);
}

// ── RENDER VIEW ──────────────────────────────────────────────
function renderView(){
  var res=computeBrokers();
  BROKERS=res.brokers;
  var s=res.summary;

  // Mode hint
  document.getElementById("modeHint").textContent=res.hint;

  // KPIs
  document.getElementById("sNew").textContent=s.totalNew;
  document.getElementById("sTotal").textContent="Tổng TK: "+s.totalAccounts;
  document.getElementById("sNAV").textContent=fmt(s.cNAV)||"0";
  document.getElementById("sAUM").textContent=fmt(s.cAUM)||"0";
  document.getElementById("sFee").textContent=fmt(s.cFee)||"0";
  // Clear badges (no comparison in this mode)
  document.getElementById("sNAVg").innerHTML="";
  document.getElementById("sAUMg").innerHTML="";
  document.getElementById("sFeeG").innerHTML="";

  // Footer
  document.getElementById("footer").textContent=
    SELECTED.length===1
      ? "NAV & AUM = "+lbl(SELECTED[0])+" − tháng trước · "+s.totalAccounts+" tài khoản"
      : "NAV & AUM cộng dồn chênh lệch: "+SELECTED.map(lbl).join("+")+" · "+s.totalAccounts+" tài khoản";

  renderBarChart();
  renderCharts();
  renderTable(BROKERS);
}

// ── BAR CHART ────────────────────────────────────────────────
function renderBarChart(){
  var top=BROKERS.slice().sort(function(a,b){return Math.abs(b.tAUM)-Math.abs(a.tAUM);}).slice(0,10);
  var mx=Math.max.apply(null,top.map(function(b){return Math.abs(b.tAUM);}));if(mx<=0)mx=1;
  document.getElementById("barChart").innerHTML=top.map(function(b,i){
    var p=(Math.abs(b.tAUM)/mx*100).toFixed(1);
    var nm=b.broker.replace(/^(FA |LM2 |LM )/g,"").split(" ").slice(0,3).join(" ");
    var cls=i===0?"c0":i===1?"c1":i===2?"c2":"cx";
    var val=fmt(b.tAUM);
    return'<div class="bar-row"><div class="bar-name" title="'+b.broker+'">'+nm+'</div>'
      +'<div class="bar-track"><div class="bar-fill '+cls+'" style="width:'+p+'%">'
      +'<span class="bar-val">'+(val||"0")+'</span></div></div></div>';
  }).join("");
}

// ── CHARTS (Fee / NAV / AUM) ─────────────────────────────────
function dc(id){if(CI[id]){CI[id].destroy();delete CI[id];}}

function makeHBar(id,data,labels,color,fmtFn){
  dc(id);
  var GRID='rgba(0,0,0,0.05)',TC='#999';
  CI[id]=new Chart(document.getElementById(id),{
    type:"bar",
    data:{
      labels:labels,
      datasets:[{
        data:data,
        backgroundColor:data.map(function(v){return v<0?"rgba(220,38,38,0.75)":color;}),
        borderRadius:4,
        borderSkipped:false
      }]
    },
    options:{
      indexAxis:"y",
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(ctx){
          return" "+(fmtFn?fmtFn(ctx.raw):ctx.raw);
        }}}
      },
      scales:{
        x:{grid:{color:GRID},ticks:{color:TC,font:{size:9},callback:function(v){return fmtFn?fmtFn(v):v;}}},
        y:{grid:{display:false},ticks:{color:"#555",font:{size:10}}}
      }
    }
  });
}

function renderCharts(){
  var top10=BROKERS.slice().sort(function(a,b){return Math.abs(b.tAUM)-Math.abs(a.tAUM);}).slice(0,10);
  var labs=top10.map(function(b){
    return b.broker.replace(/^(FA LM2 |FA LM |FA HCM |FA HQ2 |LM2 |LM |HCM )/,"").split(" ").slice(0,3).join(" ");
  });

  var subtitle=SELECTED.map(lbl).join(" + ");
  document.getElementById("cFeeSubtitle").textContent="Top 10 · "+subtitle;
  document.getElementById("cNAVSubtitle").textContent="Top 10 · "+subtitle;
  document.getElementById("cAUMSubtitle").textContent="Top 10 · "+subtitle;

  makeHBar("cFee",top10.map(function(b){return b.tFee;}),labs,"rgba(249,115,22,0.85)",fmtShort);
  makeHBar("cNAV",top10.map(function(b){return b.tNAV;}),labs,"rgba(37,99,235,0.80)",fmtShort);
  makeHBar("cAUM",top10.map(function(b){return b.tAUM;}),labs,"rgba(22,163,74,0.80)",fmtShort);
}

// ── TABLE ────────────────────────────────────────────────────
function th(col,label,cls){
  var arr=SORT_COL===col?(SORT_DIR<0?"▼":"▲"):"▼";
  var sc=SORT_COL===col?" sorted":"";
  return'<th class="'+(cls||"")+sc+'" onclick="setSort(\''+col+'\')">'
    +label+'<span class="sort-arrow">'+arr+'</span></th>';
}

function renderTable(list){
  var multi=SELECTED.length>1;
  document.getElementById("tblHead").innerHTML='<tr>'
    +'<th style="width:38px">#</th>'
    +th("broker","AE")
    +th("totalCount","Total Account","nr")
    +(!multi?th("newCount","New Account","nr"):'')
    +th("tTrading","Trading Value","nr")
    +th("tFee","Trading Fee","nr")
    +th("tNAV","NAV","nr")
    +th("tAUM","AUM","nr")
    +'</tr>';

  var sorted=sortBrokers(list);
  var totT=0,totF=0,totN=0,totA=0,totAcc=0,totNew=0;
  sorted.forEach(function(b){totT+=b.tTrading;totF+=b.tFee;totN+=b.tNAV;totA+=b.tAUM;totAcc+=b.totalCount;totNew+=b.newCount;});

  var rows=sorted.map(function(b,i){
    var idx=BROKERS.indexOf(b);
    var rc=i===0?"r1":i===1?"r2":i===2?"r3":"rx";
    var tbadge='<span class="acc-badge">'+b.totalCount+' TK</span>';
    var nbadge=b.newCount>0
      ?'<span class="acc-badge new-acc">+'+b.newCount+' mới</span>'
      :'<span class="acc-badge zero">—</span>';
    return'<tr onclick="openModal('+idx+')">'
      +'<td><span class="rank-circle '+rc+'">'+(i+1)+'</span></td>'
      +'<td class="bfw">'+b.broker+'</td>'
      +'<td class="nr">'+tbadge+'</td>'
      +(!multi?'<td class="nr">'+nbadge+'</td>':'')
      +'<td class="nr">'+fd(b.tTrading)+'</td>'
      +'<td class="nr">'+fd(b.tFee)+'</td>'
      +'<td class="nr">'+fd(b.tNAV)+'</td>'
      +'<td class="nr">'+fd(b.tAUM)+'</td>'
      +'</tr>';
  });

  var totalRow='<tr class="total-row">'
    +'<td></td><td class="total-label">TỔNG</td>'
    +'<td class="nr"><span class="acc-badge">'+totAcc+' TK</span></td>'
    +(!multi?'<td class="nr"><span class="acc-badge new-acc">+'+totNew+' mới</span></td>':'')
    +'<td class="nr" style="font-weight:700;color:var(--or)">'+fd(totT)+'</td>'
    +'<td class="nr" style="font-weight:700;color:var(--or)">'+fd(totF)+'</td>'
    +'<td class="nr" style="font-weight:700;color:var(--or)">'+fd(totN)+'</td>'
    +'<td class="nr" style="font-weight:700;color:var(--or)">'+fd(totA)+'</td>'
    +'</tr>';

  document.getElementById("tblBody").innerHTML=rows.join("")+totalRow;
}

// ── MODAL ────────────────────────────────────────────────────
function ctbl(acc){
  if(!acc||!acc.length)return'<div class="empty-msg">Không có dữ liệu.</div>';
  return'<table class="mini"><thead><tr>'
    +'<th>Tên KH</th><th>Account</th>'
    +'<th class="nr">Trading</th><th class="nr">NAV</th><th class="nr">AUM</th><th class="nr">Fee</th>'
    +'</tr></thead><tbody>'
    +acc.map(function(r){
      return'<tr><td style="font-weight:500">'+r.name+'</td>'
        +'<td style="color:var(--tx3);font-family:var(--mono);font-size:.72rem">'+r.account+'</td>'
        +'<td class="nr">'+fd(r.trading)+'</td>'
        +'<td class="nr">'+fd(r.nav)+'</td>'
        +'<td class="nr">'+fd(r.aum)+'</td>'
        +'<td class="nr">'+fd(r.fee)+'</td>'
        +'</tr>';
    }).join("")+'</tbody></table>';
}
function openModal(idx){
  var b=BROKERS[idx];
  document.getElementById("modalTitle").textContent=b.broker;
  document.getElementById("cnt1").textContent="("+b.newAcc.length+")";
  document.getElementById("cnt2").textContent="("+b.existAcc.length+")";
  document.getElementById("pane1").innerHTML=ctbl(b.newAcc);
  document.getElementById("pane2").innerHTML=ctbl(b.existAcc);
  document.getElementById("tab1").className="tab on";document.getElementById("tab2").className="tab";
  document.getElementById("pane1").className="pane on";document.getElementById("pane2").className="pane";
  document.getElementById("overlay").classList.add("open");
}
document.getElementById("closeBtn").onclick=function(){document.getElementById("overlay").classList.remove("open");};
document.getElementById("overlay").onclick=function(e){if(e.target===document.getElementById("overlay"))document.getElementById("overlay").classList.remove("open");};
document.getElementById("tab1").onclick=function(){
  this.className="tab on";document.getElementById("tab2").className="tab";
  document.getElementById("pane1").className="pane on";document.getElementById("pane2").className="pane";};
document.getElementById("tab2").onclick=function(){
  this.className="tab on";document.getElementById("tab1").className="tab";
  document.getElementById("pane2").className="pane on";document.getElementById("pane1").className="pane";};
document.getElementById("searchBox").oninput=function(){
  var q=this.value.toLowerCase();
  renderTable(BROKERS.filter(function(b){return b.broker.toLowerCase().indexOf(q)>=0;}));};

// Fix API URL to match original
document.addEventListener("DOMContentLoaded",function(){});
loadData();
</script>
